<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ShopVerse Studio</title>
  <link rel="stylesheet" href="/css/style.css?v=3.5">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="auth-wrapper">
      <div class="auth-header">
        <div style="width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(99, 102, 241, 0.5); color: #FFF;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to access your bag, monitor orders, or manage merchant inventory.</p>
      </div>

      <!-- Quick Demo Login Helper -->
      <div class="demo-credentials-box">
        <div style="font-weight: 700; color: #FFFFFF; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
          <span>1-Click Demo Profiles</span>
          <span style="font-size: 11px; font-weight: 800; color: #818CF8; text-transform: uppercase; letter-spacing: 0.05em;">Instant Access</span>
        </div>
        <div class="demo-buttons-row">
          <button type="button" class="btn btn-secondary btn-sm" id="demo-customer-btn">Customer</button>
          <button type="button" class="btn btn-secondary btn-sm" id="demo-seller-btn">Seller</button>
          <button type="button" class="btn btn-secondary btn-sm" id="demo-admin-btn">Admin</button>
        </div>
      </div>

      <!-- Alert for API errors -->
      <div id="login-alert" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-control"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          Continue to Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 13.5px; color: var(--text-muted);">
        Don't have an account yet? <a href="/register.html" style="font-weight: 700; color: #818CF8;">Create an account</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>ShopVerse Studio &bull; Modern Inventory & Retail</div>
      <div>Designed with clarity, restraint & responsive feedback</div>
    </div>
  </footer>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
