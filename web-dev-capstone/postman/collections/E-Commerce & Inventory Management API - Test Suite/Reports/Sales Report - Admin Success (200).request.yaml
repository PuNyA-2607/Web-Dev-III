$kind: http-request
url: "{{baseUrl}}/reports/sales?from=2026-01-01&to=2026-12-31"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  from: 2026-01-01
  to: 2026-12-31
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test("Response matches actual report shape with summary and dailyBreakdown", function () {
          pm.expect(res.data).to.be.an('object');
          pm.expect(res.data).to.have.property('summary');
          pm.expect(res.data.summary).to.be.an('object');
          pm.expect(res.data.summary).to.have.property('totalRevenue');
          pm.expect(res.data.summary).to.have.property('totalOrders');
          pm.expect(res.data.summary).to.have.property('totalItemsSold');
          pm.expect(res.data).to.have.property('dailyBreakdown');
          pm.expect(res.data.dailyBreakdown).to.be.an('array');
      });
    language: text/javascript
order: 1000
