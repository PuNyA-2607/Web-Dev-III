$kind: http-request
name: Get Profile /users/me - unauthorized no token (401)
url: "{{baseUrl}}/users/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
