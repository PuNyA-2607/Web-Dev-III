$kind: http-request
url: "{{baseUrl}}/categories/{{categoryId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409 when category contains products", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 7000
