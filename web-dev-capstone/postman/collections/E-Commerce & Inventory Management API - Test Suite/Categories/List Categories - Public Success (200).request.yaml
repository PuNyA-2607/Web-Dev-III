$kind: http-request
url: "{{baseUrl}}/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      if (res.data && res.data.length > 0) {
          const seeded = res.data.find(c => c.slug === 'electronics') || res.data[0];
          pm.collectionVariables.set("categoryId", seeded._id);
      }
    language: text/javascript
order: 1000
