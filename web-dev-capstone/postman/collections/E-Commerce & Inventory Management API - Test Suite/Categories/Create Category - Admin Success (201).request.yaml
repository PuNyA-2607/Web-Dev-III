$kind: http-request
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "name": "Smart Home {{$timestamp}}",
      "description": "Connected devices, hubs, and home automation accessories"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      const res = pm.response.json();
      if (res.data && res.data._id) {
          pm.collectionVariables.set("createdCategoryId", res.data._id);
      }
    language: text/javascript
order: 3000
