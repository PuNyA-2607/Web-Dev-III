$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "productId": "{{cartProductId}}",
      "quantity": 1,
      "price": 0.01
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 when client injects price", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 6000
