$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Weak User",
      "email": "weak_{{$timestamp}}@example.com",
      "password": "123",
      "role": "customer"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
