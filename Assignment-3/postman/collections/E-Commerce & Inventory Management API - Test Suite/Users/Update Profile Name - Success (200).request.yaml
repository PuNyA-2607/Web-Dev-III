$kind: http-request
url: "{{baseUrl}}/users/me"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{sellerToken}}
body:
  type: text
  content: |-
    {
      "name": "Seller A Updated"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
