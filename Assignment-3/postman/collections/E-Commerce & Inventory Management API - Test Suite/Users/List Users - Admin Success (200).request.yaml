$kind: http-request
url: "{{baseUrl}}/users?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
