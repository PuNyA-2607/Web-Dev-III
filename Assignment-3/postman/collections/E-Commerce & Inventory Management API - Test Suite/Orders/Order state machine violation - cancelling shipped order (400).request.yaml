$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "reason": "Trying to cancel shipped item"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 on invalid transition from shipped to cancelled", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
