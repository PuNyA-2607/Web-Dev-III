$kind: http-request
url: "{{baseUrl}}/reports/best-sellers?limit=5"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
