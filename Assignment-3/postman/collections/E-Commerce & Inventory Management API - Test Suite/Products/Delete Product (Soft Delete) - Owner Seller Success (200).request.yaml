$kind: http-request
url: "{{baseUrl}}/products/{{deleteProductId}}"
method: DELETE
headers:
  Authorization: Bearer {{sellerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 11000
