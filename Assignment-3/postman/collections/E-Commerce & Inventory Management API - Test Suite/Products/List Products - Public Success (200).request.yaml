$kind: http-request
url: "{{baseUrl}}/products?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      if (res.data && res.data.products && res.data.products.length > 0) {
          pm.collectionVariables.set("productId", res.data.products[0]._id);
          const cat = res.data.products[0].category;
          if (cat) {
              const catId = typeof cat === 'object' ? cat._id : cat;
              pm.collectionVariables.set("categoryId", catId);
          }
      }
    language: text/javascript
order: 1000
