$kind: http-request
url: "{{baseUrl}}/products?search=wireless&minPrice=10&maxPrice=500&sort=-price&page=1&limit=10"
method: GET
queryParams:
  search: wireless
  minPrice: "10"
  maxPrice: "500"
  sort: -price
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
