$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "productId": "{{cartProductId}}",
      "quantity": 80
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409 when quantity exceeds inventory", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 7000
