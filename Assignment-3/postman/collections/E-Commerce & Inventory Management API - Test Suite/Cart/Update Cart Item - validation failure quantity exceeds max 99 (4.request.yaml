$kind: http-request
name: Update Cart Item - validation failure quantity exceeds max 99 (400)
url: "{{baseUrl}}/cart/items/{{cartProductId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "quantity": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 9000
